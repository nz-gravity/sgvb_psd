[build-system]
requires = [
    "setuptools>=64",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]  # list of folders that contain the packages (["."] by default)
include = ["sgvb_psd*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["sgvb_psd.tests*"]  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)


[project]
name = "sgvb_psd"
dynamic = ["version"] # scm versioning (using tags)
requires-python = ">=3.10"
description = "A python package for estimating the power spectral density (PSD) of correlated multivariate detector noise using variational inference (VI)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    {name = "Jianan Liu", email = "jliu812@aucklanduni.ac.nz" },
    {name = "Avi Vajpeyi", email = "avi.vajpeyi@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Jupyter"
]
dependencies = [
    "jax>=0.6.2",
    "numpyro>=0.19.0",
    "scipy",
    "pandas",
    "numpy",
    "matplotlib",
    "hyperopt",
    "colorama",
    'click'
]

[project.optional-dependencies]
jax = [] # Compatibility alias; JAX is now the default runtime.
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "flake8",
    "black",
    "jupyter-book<2",
    "sphinx-inline-tabs",
    "pytest_click"
]

[tool.uv]
constraint-dependencies = [
    "jax==0.6.2; python_version == '3.12'",
    "jaxlib==0.6.2; python_version == '3.12'",
    "numpyro==0.19.0; python_version == '3.12'",
    "numpy==2.5.4; python_version == '3.12'",
    "scipy==1.18.1; python_version == '3.12'",
    "pandas==3.1.1; python_version == '3.12'",
    "matplotlib==3.11.2; python_version == '3.12'",
    "hyperopt==0.3.0; python_version == '3.12'",
    "colorama==0.4.6; python_version == '3.12'",
    "click==8.5.1; python_version == '3.12'",
]

[project.urls]
"Homepage" = "https://github.com/nz-gravity/sgvb_psd"
"Bug Reports" = "https://github.com/nz-gravity/sgvb_psd/issues"
"Source" = "https://github.com/nz-gravity/sgvb_psd"
"Documentation" = "https://nz-gravity.github.io/sgvb_psd/"

[tool.setuptools_scm]
version_file = "src/sgvb_psd/_version.py"

[tool.semantic_release]
version_variable = "src/sgvb_psd/_version.py:__version__"
version_source = "commit"
commit_version_number = true
commit_subject = "chore(release): {version}"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
no_local_version = true


[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.rst"

[tool.black]
line-length = 79
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | train_models
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration and visual comparison tests",
]


[project.scripts]
sgvb_benchmark = "sgvb_psd.utils.benchmark.cli:cli"
