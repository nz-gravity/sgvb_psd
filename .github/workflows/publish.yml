name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Normal main updates: calculate and create the next version automatically.
      - name: Semantic Version Release
        id: release
        if: github.ref == 'refs/heads/main'
        uses: python-semantic-release/python-semantic-release@v9.12.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      # Build after either an automatic release or a manually pushed version tag.
      - name: Build distribution
        if: startsWith(github.ref, 'refs/tags/v') || steps.release.outputs.released == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel --outdir dist/

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') || steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@v1.12.3
