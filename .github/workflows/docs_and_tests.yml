name: Tests and Documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest -m "not slow" --cov=src/sgvb_psd/ --cov-report=xml --cov-report=term-missing:skip-covered
      - uses: coverallsapp/github-action@v2
        if: github.event_name == 'push'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - name: Build the book
        run: uv run --no-sync jupyter-book build docs --config docs/_config.yaml
      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
