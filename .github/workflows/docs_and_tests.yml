name: Tests and Documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e '.[dev]' -c validation/jax-constraints.txt
      - run: pytest -m "not slow" --cov=src/sgvb_psd/ --cov-report=xml --cov-report=term-missing:skip-covered
      - uses: coverallsapp/github-action@v2
        if: github.event_name == 'push'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e '.[dev]' -c validation/jax-constraints.txt
      - name: Build the book
        run: jupyter-book build docs --config docs/_config.yaml
      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html

  jax-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e '.[dev]' -c validation/jax-constraints.txt
      - run: pip install -r validation/reference/requirements.txt
      - run: pytest tests/test_jax_backend.py -q
        env:
          MPLBACKEND: Agg
